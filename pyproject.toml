[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "micforge"
version = "1.3.0"
description = "Real-time microphone clean-up for Discord and voice chat: de-muffle, denoise, level, route."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "Parth Sadaria" },
]
keywords = [
    "audio",
    "microphone",
    "dsp",
    "noise-suppression",
    "speech-enhancement",
    "discord",
    "cofilite",
    "streaming",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Intended Audience :: Developers",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Sound/Audio :: Capture/Recording",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "sounddevice>=0.4.6",
    "rich>=13.0",
    "onnxruntime>=1.16",
    "pystray>=0.19",
    "pillow>=9.0",
    "pynput>=1.7",
]

[project.urls]
Homepage = "https://github.com/Parthsadaria/MicForge"
Documentation = "https://github.com/Parthsadaria/MicForge#readme"
Repository = "https://github.com/Parthsadaria/MicForge.git"
Issues = "https://github.com/Parthsadaria/MicForge/issues"
Changelog = "https://github.com/Parthsadaria/MicForge/tree/main/verison%20notes"

[project.optional-dependencies]
dev = ["pytest>=7", "onnx>=1.14", "build", "twine"]

[project.scripts]
micforge = "micforge.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
micforge = ["models/*.onnx"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
